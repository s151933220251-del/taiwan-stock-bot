<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f4f8;
    color: #1a1a2e;
    padding: 16px;
    max-width: 480px;

  }
  .header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);

    padding: 20px;
    border-radius: 16px;
    margin-bottom: 16px;
    text-align: center;
  }
  .header h1 { font-size: 20px; margin-bottom: 4px; }
  .header .date { font-size: 14px; opacity: 0.7; }
  .market-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .market-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
  }
  .market-label { font-size: 14px; color: #666; }
  .market-value { font-size: 16px; font-weight: 600; }
  .etf-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .etf-header {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #1a1a2e;
  }
  .etf-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .etf-table th {
    background: #f0f0f0;
    padding: 7px 8px;
    text-align: left;
    font-weight: 600;
    color: #555;
    border-bottom: 2px solid #ddd;
    font-size: 12px;
  }
  .etf-table td {
    padding: 8px 8px;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
  }
  .etf-table td.rank {
    color: #999;
    font-size: 12px;
    width: 24px;
    text-align: center;
  }
  .etf-table td.sname {
    font-weight: 500;
    color: #1a1a2e;
  }
  .etf-table td.ratio {
    text-align: right;
    font-weight: 600;
    color: #333;
    white-space: nowrap;
  }
  .etf-table td.diff {
    text-align: right;
    white-space: nowrap;
    width: 70px;
  }
  .badge-up {
    background: #fff0f0;
    color: #e53e3e;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-down {
    background: #f0fff4;
    color: #38a169;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-flat {
    color: #bbb;
    font-size: 12px;
  }
  .badge-new {
    background: #EEF2FF;
    color: #5A67D8;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .etf-link-btn {
    display: block;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
  .no-data {
    background: white;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    color: #888;
    margin-bottom: 12px;
  }
  .up { color: #e53e3e; }
  .down { color: #38a169; }
  .flat { color: #888; }
  .footer {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    padding: 12px 0;
  }
</style>
